[project]
name = "polytrade-engine"
version = "1.0.0"
description = "Moteur de lecture et de trading Polymarket (CLOB + Gamma)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "B",        # bugbear
  "S",        # bandit — règles de sécurité
  "UP",       # pyupgrade
  "C4",       # comprehensions
  "RET",      # returns
  "SIM",      # simplifications
  "TID",      # imports
]
ignore = [
  "E501",     # longueur gérée par le formateur
  "B008",
]

[tool.ruff.lint.per-file-ignores]
# Les tests ont légitimement besoin d'assert et de secrets factices.
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# --cov-fail-under fige un plancher : une baisse de couverture fait echouer la
# CI au lieu de passer inapercue dans un diff.
addopts = "-ra --strict-markers --cov=src --cov=main --cov-report=term-missing --cov-fail-under=90"
filterwarnings = [
  "error",
  # starlette 1.6 pousse httpx2 pour son TestClient ; httpx reste fonctionnel
  # et fastapi ne l'a pas encore suivi. A retirer quand fastapi migrera.
  "default::DeprecationWarning",
  "default:Using `httpx` with `starlette.testclient`:UserWarning",
]

[tool.coverage.run]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
