version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        patterns: ["ruff", "mypy", "pytest*", "types-*"]

  # Les actions GitHub sont du code exécuté avec accès au dépôt :
  # les épingler et les tenir à jour évite une compromission de chaîne.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
